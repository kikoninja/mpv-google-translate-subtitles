# translate-subtitles options
# Edit these values before starting mpv.
input_lang=en
output_lang=id
prefetch_seconds=5
toggle_key=Ctrl+t
curl_command=/usr/bin/curl
translation_backend=libretranslate
libretranslate_url=https://libretranslate.com/translate
libretranslate_api_key=

# Overlay font size (in pixels) for the translated subtitles
font_size=55

# Amount to change font size per increase/decrease key press
font_size_step=5

# Keyboard shortcuts for increasing/decreasing the overlay font size
# Set to empty string to disable a binding
increase_font_size_key=Ctrl+up
decrease_font_size_key=Ctrl+down
